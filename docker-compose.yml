services:
  rag-api:
    build:
      context: .
    image: agent-rag-demo:latest
    container_name: agent-rag-demo
    env_file:
      - .env
    environment:
      RAG_FILE_PATH: /app/data/kb
      INDEX_STORE_DIR: /app/data/manifest
      CHROMA_PERSIST_DIR: /app/data/chroma
      HF_HOME: /cache/huggingface
      SENTENCE_TRANSFORMERS_HOME: /cache/sentence-transformers
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 30
      start_period: 60s
    volumes:
      - ./data/kb:/app/data/kb:ro
      - ./data/chroma:/app/data/chroma
      - ./data/manifest:/app/data/manifest
      - ./logs:/app/logs
      - model-cache:/cache
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  model-cache:
