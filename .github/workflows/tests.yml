name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock

      - name: Compile Python sources
        run: python -m compileall -q app scripts tests

      - name: Run Ruff
        run: ruff check app tests scripts

      - name: Check module import boundaries
        run: lint-imports

      - name: Check Agent Runtime architecture
        run: python scripts/inspect_agent_runtime.py --check

      - name: Validate evaluation datasets
        run: python scripts/run_evaluation_baseline.py --validate-only

      - name: Cache PDF parser models
        id: docling-models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: ${{ runner.os }}-docling-pdf-v1-${{ hashFiles('requirements.lock', 'app/ingestion/parsing.py') }}

      - name: Prepare PDF parser models
        if: steps.docling-models.outputs.cache-hit != 'true'
        run: |
          python - <<'PY'
          from docling.datamodel.base_models import InputFormat
          from app.ingestion.parsing import _document_converter

          _document_converter().initialize_pipeline(InputFormat.PDF)
          PY

      - name: Run tests
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          python -m pytest -q
